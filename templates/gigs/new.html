{% load static %}
<link rel="stylesheet" href="{% static 'css/seller_upload_gig.css' %}">

<div class="gig-page">
  <form method="post" enctype="multipart/form-data" class="gig-card">
    {% csrf_token %}

    <div class="gig-header">
      <h1>Post a New Gig</h1>
      <p>Share your craftsmanship with the world</p>
    </div>

    <div class="gig-body">
  <div class="gig-grid">

    <!-- TITLE -->
    <div class="full">
      <label>Gig Title</label>
      {{ form.title }}
    </div>

    <!-- CATEGORY -->
    <div>
      <label>Category</label>
      {{ form.category }}
    </div>

    <!-- STATE -->
    <div>
      <label>Origin State</label>
      {{ form.state }}
    </div>

    <!-- PRICE -->
    <div>
      <label>Price (₹)</label>
      {{ form.price }}
    </div>

    <!-- TOTAL STOCK -->
    <div>
      <label>Stock Available</label>
      <input type="number" id="total-stock" class="field" readonly value="0">
    </div>

    <!-- SIZES + QTY (FULL WIDTH) -->
    <div class="full">
      <label>Available Sizes & Quantity</label>

      <div id="sizes-wrapper">
        <div class="size-row">
          <select name="size[]" class="field select-field">
            <option value="">Select Size</option>
            <option value="S">Small (S)</option>
            <option value="M">Medium (M)</option>
            <option value="L">Large (L)</option>
            <option value="FREE">Free Size</option>
          </select>

          <input type="number"
                 name="quantity[]"
                 class="field qty-field"
                 placeholder="Qty"
                 min="1">
        </div>
      </div>

      <button type="button" id="add-size-btn" class="add-size-btn">
        + Add Another Size
      </button>
    </div>

    <!-- DESCRIPTION -->
    <div class="full">
      <label>Description</label>
      {{ form.description }}
    </div>

    <!-- TAGS -->
    <div class="full">
      <label>Tags</label>
      {{ form.tags }}
    </div>

    <!-- IMAGE -->
    <div class="full">
      <label>Product Images</label>
      <div class="upload-box">
        {{ form.image }}
        <p>Supports JPG, PNG (Max 5MB)</p>
      </div>
    </div>

  </div>

  <!-- BUTTON (OUTSIDE GRID) -->
  <div class="publish-wrap">
    <button type="submit" class="publish-btn">✓ Publish Gig</button>
  </div>
</div>

    </div>

  </form>
</div>
<script src="{% static 'js/gig_sizes.js' %}"></script>
